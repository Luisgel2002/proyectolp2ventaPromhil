<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Listado de Productos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2>Listado de Productos</h2>

    <table class="table table-bordered table-hover mt-3">
        <thead class="table-dark text-center">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Categoría</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="prod : ${productos}">
                <td th:text="${prod.idProducto}">1</td>
                <td th:text="${prod.nombreProducto}">Producto</td>
                <td th:text="${prod.precio}">99.99</td>
                <td th:text="${prod.stock}">50</td>
                <td th:text="${prod.categoria != null ? prod.categoria.nombreCategoria : '—'}">Categoría</td>
            </tr>
            <tr th:if="${#lists.isEmpty(productos)}">
                <td colspan="5" class="text-center text-muted">No hay productos disponibles.</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
