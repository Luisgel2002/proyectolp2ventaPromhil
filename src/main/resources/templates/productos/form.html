<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${producto.idProducto}!=null ? 'Editar producto' : 'Nuevo producto'">Producto</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">
<div class="container mt-4">
  <h2 th:text="${producto.idProducto}!=null ? 'Editar producto' : 'Nuevo producto'">Producto</h2>

  <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" class="mt-3">
    <input type="hidden" th:field="*{idProducto}"/>

    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input class="form-control" th:field="*{nombreProducto}" required maxlength="100"/>
    </div>

    <div class="mb-3">
      <label class="form-label">Precio</label>
      <input class="form-control" th:field="*{precio}" type="number" step="0.01" min="0" required/>
    </div>

    <div class="mb-3">
      <label class="form-label">Stock</label>
      <input class="form-control" th:field="*{stock}" type="number" step="1" min="0" required/>
    </div>

    <div class="mb-3">
      <label class="form-label">Categoría</label>
      <select class="form-select" name="idCategoria" required>
        <option th:each="c : ${categorias}"
                th:value="${c.idCategoria}"
                th:text="${c.nombreCategoria}"
                th:selected="${producto.categoria != null and c.idCategoria == producto.categoria.idCategoria}">Cat</option>
      </select>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-success">Guardar</button>
      <a th:href="@{/productos}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
</body>
</html>
