<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${categoria.idCategoria} != null ? 'Editar categoría' : 'Nueva categoría'">Categoría</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2 th:text="${categoria.idCategoria} != null ? 'Editar categoría' : 'Nueva categoría'">Categoría</h2>

    <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post" class="mt-3">
        <input type="hidden" th:field="*{idCategoria}"/>

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input class="form-control" th:field="*{nombreCategoria}" required maxlength="100"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <input class="form-control" th:field="*{descripcion}" required maxlength="150"/>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/categorias}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

</body>
</html>
